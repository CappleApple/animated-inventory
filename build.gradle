plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.143'
}

group = 'com.cappleapple.animatedinventory'
version = mod_version
base.archivesName = 'animatedinventory'
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

neoForge {
    version = neo_version
    runs {
        client {
            client()
            gameDirectory = file('run-client')
        }
        server {
            server()
            gameDirectory = file('run-server')
            programArgument '--nogui'
        }
    }
    mods {
        animatedinventory { sourceSet sourceSets.main }
    }
    unitTest {
        enable()
        testedMod = mods.animatedinventory
    }
}

repositories { mavenCentral() }
dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.named('test', Test) { useJUnitPlatform() }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('processResources') {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand(version: project.version) }
}
tasks.named('jar') { from('LICENSE') }

// Opt-in fixtures run only in development; neither source nor binary jar includes them.
sourceSets {
    validation {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
if (project.hasProperty('clientValidation') || project.hasProperty('serverValidation')) {
    neoForge.mods.animatedinventory.sourceSet(sourceSets.validation)
}
if (project.hasProperty('serverValidation')) {
    if (project.hasProperty('sophisticatedValidation')) neoForge.runs.server.gameDirectory = file('run-server-sophisticated')
    neoForge.runs.server.systemProperty 'animatedinventory.serverValidation', 'true'
}
if (project.hasProperty('clientValidation')) {
    neoForge.runs.client {
        systemProperty 'animatedinventory.validation', 'true'
        if (project.hasProperty('initialContentsValidation')) systemProperty 'animatedinventory.initialContentsValidation', 'true'
        if (project.hasProperty('bnsValidation')) systemProperty 'animatedinventory.bnsValidation', 'true'
        if (project.hasProperty('sophisticatedValidation')) systemProperty 'animatedinventory.sophisticatedValidation', 'true'
        if (project.hasProperty('transferValidation')) systemProperty 'animatedinventory.transferValidation', 'true'
        if (project.hasProperty('stashValidation')) systemProperty 'animatedinventory.stashValidation', 'true'
        if (project.hasProperty('trashValidation')) systemProperty 'animatedinventory.trashValidation', 'true'
        if (project.hasProperty('craftingValidation')) systemProperty 'animatedinventory.craftingValidation', 'true'
        if (project.hasProperty('configValidation')) systemProperty 'animatedinventory.configValidation', 'true'
        gameDirectory = file(project.hasProperty('trashValidation') ? 'run-validation-trash' : project.hasProperty('jeiValidation') ? 'run-validation-recipe-jei' : project.hasProperty('sophisticatedValidation') ? (project.hasProperty('compatValidation') ? 'run-validation-sophisticated-compat' : 'run-validation-sophisticated') : project.hasProperty('configValidation') ? 'run-validation-config' : project.hasProperty('compatValidation') ? 'run-validation-compat' : project.hasProperty('bnsValidation') ? 'run-validation-bns' : project.hasProperty('craftingValidation') ? 'run-validation-crafting' : 'run-validation')
    }
    def validationReport = file((project.hasProperty('trashValidation') ? 'run-validation-trash' : project.hasProperty('jeiValidation') ? 'run-validation-recipe-jei' : project.hasProperty('sophisticatedValidation') ? (project.hasProperty('compatValidation') ? 'run-validation-sophisticated-compat' : 'run-validation-sophisticated') : project.hasProperty('configValidation') ? 'run-validation-config' : project.hasProperty('compatValidation') ? 'run-validation-compat' : project.hasProperty('bnsValidation') ? 'run-validation-bns' : project.hasProperty('craftingValidation') ? 'run-validation-crafting' : 'run-validation') + '/validation/results.txt')
    tasks.named('runClient').configure {
        doFirst { if (validationReport.exists()) validationReport.delete() }
        doLast {
            if (!validationReport.exists() || validationReport.text.contains('FAIL ')
                    || !validationReport.text.contains('PASS validation completed')) {
                throw new GradleException('Client validation did not pass; inspect the validation results and client log.')
            }
        }
    }
}
