plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}
group = 'com.cappleapple.animatedinventory'
version = mod_version
base.archivesName = "animatedinventory-neoforge-${minecraft_version}"
java { toolchain.languageVersion = JavaLanguageVersion.of(25); withSourcesJar() }

neoForge {
    version = neo_version
    runs {
        client { client(); gameDirectory = file('run-client') }
        server { server(); gameDirectory = file('run-server'); programArgument '--nogui' }
    }
    mods { animatedinventory { sourceSet sourceSets.main } }
    unitTest { enable(); testedMod = mods.animatedinventory }
}
repositories { mavenCentral() }
dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.named('test', Test) { useJUnitPlatform() }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('processResources') {
    inputs.properties(version: project.version, minecraft_version: minecraft_version, neo_version: neo_version)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(version: project.version, minecraft_version: minecraft_version, neo_version: neo_version)
    }
}
tasks.named('jar') { from('LICENSE') }

sourceSets {
    validation {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
if (project.hasProperty('clientValidation') || project.hasProperty('serverValidation')) {
    neoForge.mods { animatedinventory_validation { sourceSet sourceSets.validation } }
}
if (project.hasProperty('clientValidation')) {
    neoForge.runs.client { gameDirectory = file('run-validation'); systemProperty 'fml.earlyWindowControl', 'false' }

    tasks.named('runClient') {
        doFirst {
            file('run-validation/config').mkdirs()
            file('run-validation/config/fml.toml').text = 'earlyWindowControl=false\nmaxThreads=2\n'
            file('run-validation/options.txt').text = 'soundCategory_master:0.0\npauseOnLostFocus:false\nfullscreen:false\nmaxFps:30\n'
            file('run-validation/validation.txt').delete()
        }
        doLast {
            def report = file('run-validation/validation.txt')
            if (!report.exists() || !report.text.contains('PASS complete') || report.text.contains('FAIL')) throw new GradleException('Client validation failed; inspect run-validation logs.')
        }
    }
}
if (project.hasProperty('serverValidation')) {
    tasks.named('runServer') {
        doFirst {
            file('run-server').mkdirs()
            file('run-server/eula.txt').text = 'eula=true\n'
            file('run-server/server.properties').text = 'server-ip=127.0.0.1\nserver-port=0\nonline-mode=false\nlevel-type=minecraft:flat\nview-distance=2\nsimulation-distance=2\nmax-tick-time=0\n'
            file('run-server/server-validation.txt').delete()
        }
        doLast {
            def report = file('run-server/server-validation.txt')
            if (!report.exists() || !report.text.contains('PASS')) throw new GradleException('Dedicated server validation failed.')
        }
    }
}

neoForge.runs.configureEach { jvmArgument '-Xmx2G'; jvmArgument '-XX:ActiveProcessorCount=2' }

tasks.withType(Test).configureEach { maxHeapSize = '2G'; jvmArgs '-XX:ActiveProcessorCount=2' }

if (project.hasProperty('captureValidation')) neoForge.runs.client { systemProperty 'animatedinventory.captureValidation', 'true' }
