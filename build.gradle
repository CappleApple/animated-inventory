plugins {
    id 'net.fabricmc.fabric-loom' version '1.18.2'
    id 'maven-publish'
}
version = mod_version
group = 'com.cappleapple.animatedinventory'
base.archivesName = "animatedinventory-fabric-${minecraft_version}"
java { toolchain.languageVersion = JavaLanguageVersion.of(25); withSourcesJar() }
repositories { mavenCentral() }

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation include("net.fabricmc.fabric-api:fabric-api-base:2.0.4+ece063239e")
    implementation include("net.fabricmc.fabric-api:fabric-resource-loader-v1:2.0.13+9edec1269e")
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.named('test', Test) { useJUnitPlatform() }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
processResources {
    inputs.properties(version: project.version, minecraft_version: minecraft_version, loader_version: loader_version)
    filesMatching('fabric.mod.json') { expand(version: project.version, minecraft_version: minecraft_version, loader_version: loader_version) }
}
jar { from('LICENSE') }

sourceSets {
    validation {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
if (project.hasProperty('clientValidation') || project.hasProperty('serverValidation')) {
    loom.mods {
        animatedinventory { sourceSet sourceSets.main }
        animatedinventory_validation { sourceSet sourceSets.validation }
    }
}
if (project.hasProperty('clientValidation')) {
    loom.runs.client { runDir 'run-validation'; source sourceSets.validation }

    tasks.named('runClient') {
        doFirst {
            file('run-validation').mkdirs()
            file('run-validation/options.txt').text = 'onboardAccessibility:true\ntutorialStep:none\nsoundCategory_master:0.0\npauseOnLostFocus:false\nfullscreen:false\nmaxFps:30\nrenderDistance:2\nsimulationDistance:2\n'
            file('run-validation/validation.txt').delete()
        }
        doLast {
            def report = file('run-validation/validation.txt')
            if (!report.exists() || !report.text.contains('PASS complete') || report.text.contains('FAIL')) throw new GradleException('Client validation failed; inspect run-validation logs.')
        }
    }
}
if (project.hasProperty('serverValidation')) {
    loom.runs.server { runDir 'run-server'; source sourceSets.validation; programArg '--nogui' }
    tasks.named('runServer') {
        doFirst {
            file('run-server').mkdirs()
            file('run-server/eula.txt').text = 'eula=true\n'
            file('run-server/server.properties').text = 'server-ip=127.0.0.1\nserver-port=0\nonline-mode=false\nlevel-type=minecraft:flat\nview-distance=2\nsimulation-distance=2\nmax-tick-time=0\n'
            file('run-server/server-validation.txt').delete()
        }
        doLast {
            def report = file('run-server/server-validation.txt')
            if (!report.exists() || !report.text.contains('PASS')) throw new GradleException('Dedicated server validation failed.')
        }
    }
}

tasks.configureEach { if (name == 'downloadAssets') doNotTrackState('The shared Minecraft asset cache contains transient locks from concurrent builds.') }

loom.runs.configureEach { vmArg '-Xmx2G'; vmArg '-XX:ActiveProcessorCount=2' }

tasks.withType(Test).configureEach { maxHeapSize = '2G'; jvmArgs '-XX:ActiveProcessorCount=2' }

if (project.hasProperty('captureValidation')) loom.runs.client { property 'animatedinventory.captureValidation', 'true' }
